<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador de tanque de agua (RK4)</title>
<style>
  :root{
    --bg:#f3f6f7; --panel:#ffffff; --ink:#14262e; --muted:#5b6f78; --line:#cfdadf;
    --accent:#0b7a9e; --accent2:#c2570c; --grid:#e3eaed; --danger:#b3261e;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f1a1f; --panel:#16252c; --ink:#e4eef2; --muted:#93a8b1; --line:#2c424c;
      --accent:#4cc3e6; --accent2:#f0955a; --grid:#22343c; --danger:#ff8a80;
    }
  }
  html,body{margin:0;height:auto}
  body{background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,sans-serif;
       padding:16px;box-sizing:border-box}
  h1{font-size:1.3rem;margin:0 0 2px}
  .sub{color:var(--muted);margin:0 0 14px}
  .layout{display:grid;grid-template-columns:300px 1fr;gap:14px;max-width:1200px;margin:0 auto}
  @media (max-width:820px){.layout{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
  fieldset{border:0;padding:0;margin:0 0 12px}
  legend{font-weight:600;margin-bottom:6px}
  label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:5px 0}
  input[type=number]{width:96px;padding:4px 6px;border:1px solid var(--line);border-radius:4px;
       background:var(--bg);color:var(--ink);font:inherit}
  button{width:100%;padding:9px;border:0;border-radius:6px;background:var(--accent);color:#fff;
       font:inherit;font-weight:600;cursor:pointer}
  button:focus-visible,input:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
  button.sec{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500;padding:7px 6px;font-size:.85rem}
  button.sec[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);color:var(--accent)}
  .scen{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .scen .wide{grid-column:1 / -1}
  #exp{margin-top:8px}
  #msg{min-height:1.3em;color:var(--danger);font-size:.85rem;margin-top:8px}
  .stats{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:.85rem;margin:0 0 8px}
  .stats b{color:var(--ink)}
  canvas{width:100%;display:block;margin-bottom:10px}
  .scroll{overflow-x:auto}
  .verif h2{font-size:1rem;margin:4px 0 8px}
  .verif table{width:100%;border-collapse:collapse;font-size:.88rem}
  .verif th,.verif td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line)}
  .verif td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .verif td.note{color:var(--muted)}
  .ok{color:#1b7f3b;font-weight:600}
  .warn{color:var(--danger);font-weight:600}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ok{color:#6fd68f}}
</style>
</head>
<body>
<h1>Tanque de agua: simulación con Runge-Kutta 4</h1>
<p class="sub">dh/dt = Qi(t)/A − (K/A)·√h &nbsp;|&nbsp; tiempo en horas, h en m, caudales en m³/h</p>

<div class="layout">
  <div class="panel">
    <fieldset>
      <legend>Escenarios predefinidos</legend>
      <div class="scen" id="scen">
        <button type="button" class="sec" data-s="eq" aria-pressed="false">Equilibrio (Qi = 10)</button>
        <button type="button" class="sec" data-s="up" aria-pressed="false">Escalón +20 % (Qi = 12)</button>
        <button type="button" class="sec" data-s="down" aria-pressed="false">Escalón −20 % (Qi = 8)</button>
        <button type="button" class="sec" data-s="over" aria-pressed="false">Desborde (Qi = 15)</button>
        <button type="button" class="sec wide" data-s="fill" aria-pressed="false">Llenado desde h = 0</button>
      </div>
    </fieldset>
    <fieldset>
      <legend>Parámetros del tanque</legend>
      <label>A, área (m²) <input id="A" type="number" value="10" min="0.1" step="0.1"></label>
      <label>K, coef. de descarga <input id="K" type="number" value="4.47" min="0" step="0.01"></label>
      <label>H, altura máx. (m) <input id="H" type="number" value="10" min="0.1" step="0.1"></label>
      <label>h(0) (m) <input id="h0" type="number" value="5" min="0" step="0.1"></label>
    </fieldset>
    <fieldset>
      <legend>Entrada Qi(t)</legend>
      <label>Qi inicial (m³/h) <input id="Qi0" type="number" value="10" min="0" step="0.1"></label>
      <label>Qi final (m³/h) <input id="Qi1" type="number" value="15" min="0" step="0.1"></label>
      <label>Tiempo del escalón (h) <input id="tStep" type="number" value="5" min="0" step="0.1"></label>
    </fieldset>
    <fieldset>
      <legend>Simulación</legend>
      <label>Tiempo total (h) <input id="Tsim" type="number" value="30" min="0.1" step="1"></label>
      <label>Paso fijo dt (h) <input id="dt" type="number" value="0.05" min="0.0001" step="0.01"></label>
    </fieldset>
    <button id="run">Simular</button>
    <button id="exp" class="sec" type="button">Exportar datos a CSV</button>
    <div id="msg" role="status"></div>
  </div>

  <div class="panel">
    <p class="stats" id="stats"></p>
    <div class="scroll"><canvas id="c1" height="300"></canvas></div>
    <div class="scroll"><canvas id="c2" height="300"></canvas></div>
    <div class="verif scroll" id="verif"></div>
  </div>
</div>

<script>
"use strict";

/* ============================================================
   MODELO MATEMÁTICO
   ============================================================ */

/* Entrada Qi(t) [m³/h]: escalón de Qi0 a Qi1 en t = tStep.
   Es la función de forzamiento Qi(t) de la EDO. */
function qi(t, p) {
  return t >= p.tStep ? p.Qi1 : p.Qi0;
}

/* Lado derecho de la EDO:  dh/dt = Qi(t)/A − (K/A)·√h
   Se usa max(h,0) para que la raíz nunca sea de un número negativo
   cuando una etapa intermedia de RK4 se sale del rango físico. */
function f(t, h, p) {
  return qi(t, p) / p.A - (p.K / p.A) * Math.sqrt(Math.max(h, 0));
}

/* Caudal de salida:  Qo(t) = K·√h(t)  [m³/h] */
function qo(h, p) {
  return p.K * Math.sqrt(Math.max(h, 0));
}

/* Restricción física del tanque: 0 ≤ h ≤ H.
   En h = H el exceso se derrama; en h = 0 el tanque está vacío. */
function clampH(h, p) {
  return Math.min(Math.max(h, 0), p.H);
}

/* ============================================================
   INTEGRADOR
   ============================================================ */

/* Un paso de Runge-Kutta de 4.º orden para dh/dt = f(t,h):
     k1 = f(t,        h)
     k2 = f(t+dt/2,   h + dt/2·k1)
     k3 = f(t+dt/2,   h + dt/2·k2)
     k4 = f(t+dt,     h + dt·k3)
     h(t+dt) = h + dt/6·(k1 + 2k2 + 2k3 + k4)
   Las etapas intermedias se limitan a [0,H] y el resultado final también.
   Nota: si el escalón cae dentro de un paso, Qi se evalúa en cada etapa,
   por lo que el error local aumenta; con tStep múltiplo de dt es exacto. */
function rk4Step(t, h, dt, p) {
  const k1 = f(t, h, p);
  const k2 = f(t + dt / 2, clampH(h + dt / 2 * k1, p), p);
  const k3 = f(t + dt / 2, clampH(h + dt / 2 * k2, p), p);
  const k4 = f(t + dt,     clampH(h + dt * k3, p), p);
  return clampH(h + dt / 6 * (k1 + 2 * k2 + 2 * k3 + k4), p);
}

/* Integra desde t=0 hasta Tsim con paso fijo dt.
   Devuelve las series t[], h[] (m), qo[] (m³/h) y qi[] (m³/h). */
function simulate(p) {
  const n = Math.ceil(p.Tsim / p.dt - 1e-9);
  const out = { t: [], h: [], qo: [], qi: [] };
  let h = clampH(p.h0, p), t = 0;
  for (let i = 0; i <= n; i++) {
    out.t.push(t); out.h.push(h);
    out.qo.push(qo(h, p)); out.qi.push(qi(t, p));
    const dt = Math.min(p.dt, p.Tsim - t);      // último paso ajustado al final
    if (dt <= 1e-12) break;
    h = rk4Step(t, h, dt, p);
    t += dt;
  }
  return out;
}

/* ============================================================
   GRAFICACIÓN (canvas 2D, sin librerías)
   ============================================================ */

/* ============================================================
   MODELO LINEALIZADO Y VERIFICACIÓN
   ============================================================ */

/* Parámetros de la linealización alrededor del equilibrio previo al escalón.
   Equilibrio (dh/dt = 0):  h_eq = (Qi0/K)²
   Ganancia estática:       R   = 2·√h_eq / K            [h/(m³/h)]
   Constante de tiempo:     τ   = 2·A·√h_eq / K          [h]
   Devuelve null si no existe linealización (K ≤ 0 o Qi0 ≤ 0 → h_eq = 0). */
function linearModel(p) {
  if (!(p.K > 0) || !(p.Qi0 > 0)) return null;
  const heq = Math.pow(p.Qi0 / p.K, 2), s = Math.sqrt(heq);
  return { heq, R: 2 * s / p.K, tau: 2 * p.A * s / p.K };
}

/* Respuesta linealizada ante el escalón ΔQi = Qi1 − Qi0 en t0 = tStep:
     h_lin(t) = h_eq                                   para t < t0
     h_lin(t) = h_eq + R·ΔQi·(1 − exp(−(t − t0)/τ))    para t ≥ t0
   No se limita a [0,H]: es el modelo lineal "puro". */
function hLin(t, L, p) {
  if (t < p.tStep) return L.heq;
  return L.heq + L.R * (p.Qi1 - p.Qi0) * (1 - Math.exp(-(t - p.tStep) / L.tau));
}

/* Error relativo en %:  |valor − ref| / |ref| · 100  (null si ref no es válido). */
function relErr(val, ref) {
  return (isFinite(ref) && ref !== 0) ? Math.abs(val - ref) / Math.abs(ref) * 100 : null;
}

/* Panel de verificación:
     h_ss = (Qi_final / K)²     nivel estacionario teórico (dh/dt = 0 con Qi = Qi1)
   Se compara con h(Tsim) simulado. Si h_ss > H el tanque rebosa y el valor
   alcanzable es H, por lo que se muestra también el error contra min(h_ss, H). */
function renderVerification(out, p, L) {
  const n = out.t.length - 1, hSim = out.h[n];
  const hss = p.K > 0 ? Math.pow(p.Qi1 / p.K, 2) : Infinity;
  const hssEff = Math.min(hss, p.H);
  const f3 = v => isFinite(v) ? v.toFixed(4) : "—";
  const pc = v => v === null ? "—" : v.toFixed(3) + " %";
  const rows = [];
  rows.push(["h_ss teórico = (Qi final/K)²", f3(hss) + " m", hss > p.H ? "supera H: el tanque rebosa" : ""]);
  rows.push(["h_ss alcanzable = mín(h_ss, H)", f3(hssEff) + " m", ""]);
  rows.push(["h simulado en t = Tsim", f3(hSim) + " m", ""]);
  rows.push(["Error relativo vs h_ss teórico", pc(relErr(hSim, hss)),
             hss > p.H ? "esperable: el límite H impide alcanzar h_ss" : ""]);
  const eEff = relErr(hSim, hssEff);
  rows.push(["Error relativo vs h_ss alcanzable", pc(eEff), ""]);
  if (L) {
    const hLinInf = L.heq + L.R * (p.Qi1 - p.Qi0);
    rows.push(["Linealizado: h_eq, R, τ",
               f3(L.heq) + " m, " + f3(L.R) + " m·h/m³, " + f3(L.tau) + " h", ""]);
    rows.push(["Linealizado: h_lin(∞) = h_eq + R·ΔQi", f3(hLinInf) + " m", ""]);
    rows.push(["Error de h_lin(∞) vs h_ss teórico", pc(relErr(hLinInf, hss)),
               "mide la pérdida de validez de la linealización"]);
    rows.push(["Error de h_lin(Tsim) vs h simulado", pc(relErr(hLin(p.Tsim, L, p), hSim)), ""]);
  } else {
    rows.push(["Modelo linealizado", "no disponible", "requiere K > 0 y Qi inicial > 0"]);
  }
  // ¿Hubo tiempo suficiente para converger? Se exige ≥ 5 constantes de tiempo
  // locales, τ_f = 2·A·√h_ss / K, después del escalón.
  let conv = "";
  if (p.K > 0 && hssEff > 0) {
    const tauF = 2 * p.A * Math.sqrt(hssEff) / p.K, el = p.Tsim - p.tStep;
    conv = el >= 5 * tauF
      ? '<span class="ok">Convergido</span>'
      : '<span class="warn">No convergido</span>';
    rows.push(["Tiempo tras escalón / (5·τ final)", (el / (5 * tauF)).toFixed(2) + " → " + conv,
               el >= 5 * tauF ? "" : "aumenta el tiempo total antes de juzgar el error"]);
  }
  $("verif").innerHTML = "<h2>Verificación del estado estacionario</h2><table>" +
    rows.map(r => "<tr><th>" + r[0] + '</th><td class="num">' + r[1] + '</td><td class="note">' + r[2] + "</td></tr>").join("") +
    "</table>";
}

/* Redondea el rango del eje a una escala "agradable" (1, 2, 5 × 10^n). */
function niceTicks(min, max, count) {
  const span = (max - min) || 1;
  const raw = span / count, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const r = raw / mag, step = (r < 1.5 ? 1 : r < 3 ? 2 : r < 7 ? 5 : 10) * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const ticks = [];
  for (let v = lo; v <= hi + step / 2; v += step) ticks.push(+v.toPrecision(10));
  return { lo, hi, ticks };
}

function css(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

/* Dibuja una gráfica con ejes rotulados y unidades.
   series: [{x[], y[], color, label, dash?}] */
function drawChart(canvas, series, o) {
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.clientWidth, H = +canvas.getAttribute("height");
  canvas.width = W * dpr; canvas.height = H * dpr;
  const g = canvas.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);
  const m = { l: 62, r: 16, t: 28, b: 48 };
  const pw = W - m.l - m.r, ph = H - m.t - m.b;

  let ymin = o.ymin ?? Infinity, ymax = o.ymax ?? -Infinity;
  if (o.ymin === undefined || o.ymax === undefined) {
    series.forEach(s => s.y.forEach(v => {
      if (o.ymin === undefined) ymin = Math.min(ymin, v);
      if (o.ymax === undefined) ymax = Math.max(ymax, v);
    }));
    const pad = (ymax - ymin) * 0.08 || 1;
    if (o.ymin === undefined) ymin -= pad;
    if (o.ymax === undefined) ymax += pad;
  }
  const yt = niceTicks(ymin, ymax, 6), xt = niceTicks(0, o.xmax, 8);
  const X = v => m.l + (v - xt.lo) / (xt.hi - xt.lo) * pw;
  const Y = v => m.t + ph - (v - yt.lo) / (yt.hi - yt.lo) * ph;

  g.font = "12px 'Segoe UI',system-ui,sans-serif";
  g.fillStyle = css("--muted"); g.strokeStyle = css("--grid"); g.lineWidth = 1;

  g.textAlign = "right"; g.textBaseline = "middle";
  yt.ticks.forEach(v => {
    g.beginPath(); g.moveTo(m.l, Y(v)); g.lineTo(m.l + pw, Y(v)); g.stroke();
    g.fillText(+v.toFixed(4), m.l - 6, Y(v));
  });
  g.textAlign = "center"; g.textBaseline = "top";
  xt.ticks.forEach(v => {
    g.beginPath(); g.moveTo(X(v), m.t); g.lineTo(X(v), m.t + ph); g.stroke();
    g.fillText(+v.toFixed(4), X(v), m.t + ph + 5);
  });

  g.strokeStyle = css("--muted"); g.strokeRect(m.l, m.t, pw, ph);

  g.save(); g.beginPath(); g.rect(m.l, m.t, pw, ph); g.clip();
  series.forEach(s => {
    g.strokeStyle = s.color; g.lineWidth = s.dash ? 1.5 : 2.2;
    g.setLineDash(s.dash || []); g.beginPath();
    s.x.forEach((x, i) => i ? g.lineTo(X(x), Y(s.y[i])) : g.moveTo(X(x), Y(s.y[i])));
    g.stroke();
  });
  g.restore(); g.setLineDash([]);

  // Rótulos de ejes con unidades y título
  g.fillStyle = css("--ink"); g.textAlign = "center"; g.textBaseline = "bottom";
  g.fillText("Tiempo t (h)", m.l + pw / 2, H - 6);
  g.save(); g.translate(14, m.t + ph / 2); g.rotate(-Math.PI / 2);
  g.textBaseline = "top"; g.fillText(o.ylabel, 0, 0); g.restore();
  g.font = "600 13px 'Segoe UI',system-ui,sans-serif"; g.textAlign = "left"; g.textBaseline = "top";
  g.fillText(o.title, m.l, 6);

  // Leyenda
  g.font = "12px 'Segoe UI',system-ui,sans-serif"; g.textAlign = "right";
  let lx = m.l + pw - 4;
  [...series].reverse().forEach(s => {
    const w = g.measureText(s.label).width;
    g.fillStyle = css("--ink"); g.fillText(s.label, lx, 8);
    g.strokeStyle = s.color; g.setLineDash(s.dash || []); g.lineWidth = 2;
    g.beginPath(); g.moveTo(lx - w - 26, 14); g.lineTo(lx - w - 6, 14); g.stroke();
    g.setLineDash([]); lx -= w + 36;
  });
}

/* ============================================================
   INTERFAZ
   ============================================================ */
const $ = id => document.getElementById(id);
let last = null;

function readParams() {
  const v = id => parseFloat($(id).value);
  const p = { A: v("A"), K: v("K"), H: v("H"), h0: v("h0"), Qi0: v("Qi0"), Qi1: v("Qi1"),
              tStep: v("tStep"), Tsim: v("Tsim"), dt: v("dt") };
  const bad = Object.entries(p).find(([, x]) => !isFinite(x));
  if (bad) return { err: "Valor no numérico en «" + bad[0] + "»." };
  if (p.A <= 0 || p.H <= 0 || p.K < 0) return { err: "A y H deben ser > 0 y K ≥ 0." };
  if (p.Tsim <= 0 || p.dt <= 0) return { err: "El tiempo total y dt deben ser > 0." };
  if (p.Qi0 < 0 || p.Qi1 < 0 || p.h0 < 0) return { err: "Qi y h(0) no pueden ser negativos." };
  if (p.Tsim / p.dt > 2e6) return { err: "Demasiados pasos (máx. 2 000 000): aumenta dt." };
  return { p };
}

function render() {
  if (!last) return;
  const { out, p } = last;
  const s1 = [{ x: out.t, y: out.h, color: css("--accent"), label: "h(t) RK4" },
              { x: [0, p.Tsim], y: [p.H, p.H], color: css("--danger"), label: "H = " + +p.H.toFixed(3) + " m", dash: [6, 4] }];
  if (out.hlin) s1.push({ x: out.t, y: out.hlin, color: css("--accent2"), label: "h_lin(t)", dash: [2, 3] });
  drawChart($("c1"), s1,
            { title: "Nivel del tanque", ylabel: "Altura h (m)", xmax: p.Tsim, ymin: 0, ymax: p.H * 1.05 });
  drawChart($("c2"), [{ x: out.t, y: out.qi, color: css("--muted"), label: "Qi(t)", dash: [6, 4] },
                      { x: out.t, y: out.qo, color: css("--accent2"), label: "Qo(t) = K·√h" }],
            { title: "Caudales de entrada y salida", ylabel: "Caudal Q (m³/h)", xmax: p.Tsim, ymin: 0 });
}

function run() {
  const { p, err } = readParams();
  $("msg").textContent = err || "";
  if (err) return;
  const out = simulate(p), n = out.t.length - 1;
  const L = linearModel(p);                       // null si K ≤ 0 o Qi0 ≤ 0
  out.hlin = L ? out.t.map(t => hLin(t, L, p)) : null;
  last = { out, p };
  renderVerification(out, p, L);
  // Equilibrio analítico: dh/dt = 0  →  h* = (Qi/K)²  (acotado a H)
  const hEq = a => Math.min(p.H, p.K > 0 ? Math.pow(a / p.K, 2) : Infinity);
  $("stats").innerHTML =
    "h(0) = <b>" + out.h[0].toFixed(3) + " m</b>" +
    "h final = <b>" + out.h[n].toFixed(3) + " m</b>" +
    "Qo final = <b>" + out.qo[n].toFixed(3) + " m³/h</b>" +
    "h* con Qi inicial = <b>" + hEq(p.Qi0).toFixed(3) + " m</b>" +
    "h* con Qi final = <b>" + hEq(p.Qi1).toFixed(3) + " m</b>" +
    "pasos = <b>" + n + "</b>";
  $("stats").innerHTML = $("stats").innerHTML.replace(/<\/b>(?=[a-zA-Z])/g, "</b><span>&nbsp;·&nbsp;</span>");
  render();
}

/* Escenarios predefinidos. Cada uno fija todos los parámetros (tanque base:
   A = 10 m², K = 4.47, H = 10 m) y luego ejecuta la simulación.
   Equilibrio: h* = (Qi/K)² = 5 m con Qi = 10 m³/h.
   Desborde:   Qi = 15 → h* = 11.26 m > H, por lo que el nivel se satura en H. */
const BASE = { A: 10, K: 4.47, H: 10, h0: 5, Qi0: 10, Qi1: 10, tStep: 5, Tsim: 80, dt: 0.05 };
const SCEN = {
  eq:   {},                                   // sin escalón: permanece en equilibrio
  up:   { Qi1: 12 },                          // +20 %  → h* = 7.21 m
  down: { Qi1: 8 },                           // −20 %  → h* = 3.20 m
  over: { Qi1: 15 },                          // desborde
  fill: { h0: 0, tStep: 0 }                   // llenado desde vacío con Qi = 10
};

function applyScenario(key) {
  const s = Object.assign({}, BASE, SCEN[key]);
  Object.keys(s).forEach(id => { $(id).value = s[id]; });
  document.querySelectorAll("#scen button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.s === key)));
  run();
}

/* Exporta la última simulación válida a CSV (separador coma, punto decimal).
   Columnas: t (h), Qi (m³/h), h (m), Qo (m³/h) y, si existe, h_lin (m). */
function exportCsv() {
  if (!last) return;
  const { out } = last;
  const head = ["t_h", "Qi_m3_h", "h_m", "Qo_m3_h"].concat(out.hlin ? ["h_lin_m"] : []);
  const rows = out.t.map((t, i) => [t, out.qi[i], out.h[i], out.qo[i]]
    .concat(out.hlin ? [out.hlin[i]] : []).map(v => +v.toPrecision(10)).join(","));
  const blob = new Blob([head.join(",") + "\n" + rows.join("\n") + "\n"], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "simulacion_tanque.csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

$("scen").addEventListener("click", e => {
  const b = e.target.closest("button[data-s]");
  if (b) applyScenario(b.dataset.s);
});
$("exp").addEventListener("click", exportCsv);
// Editar un parámetro a mano deja de ser un escenario predefinido
document.querySelectorAll(".panel input").forEach(i => i.addEventListener("input", () =>
  document.querySelectorAll("#scen button").forEach(b => b.setAttribute("aria-pressed", "false"))));
$("run").addEventListener("click", run);
document.querySelectorAll("input").forEach(i =>
  i.addEventListener("keydown", e => { if (e.key === "Enter") run(); }));
window.addEventListener("resize", render);
run();
</script>
